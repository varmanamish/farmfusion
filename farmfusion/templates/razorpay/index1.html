{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PayPal JS SDK Standard Integration</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body class="bg-light">

        <div class="d-flex justify-content-center align-items-center min-vh-100">
            <div class="text-center">
                <div id="paypal-button-container"></div>
                <p id="result-message" class="mt-3 text-success fw-semibold"></p>
            </div>
        </div>

        <!-- PayPal SDK -->
        <script
            src="https://www.paypal.com/sdk/js?client-id=AYVxyapMMEcx2HPqnIXD4w0f-ESD-CDH0x9yzKDVcSFQD2vv-LthWzNtVGfuKxFBMh7B0P6eNnCICiXS&buyer-country=US&currency=USD&components=buttons&enable-funding=venmo,paylater,card"
            data-sdk-integration-source="developer-studio"
        ></script>
        <script src="{% static 'js/app.js' %}"></script>
    </body>
</html>
